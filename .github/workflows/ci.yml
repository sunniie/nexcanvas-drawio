name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (${{ matrix.os }}, Python ${{ matrix.python }})
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run Draw.io QA regression tests
        run: python scripts/test_drawio_qa.py -v
      - name: Test packaged install outside the repository
        run: python scripts/package_smoke.py

  skill-validation:
    name: Skill and repository validation
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/validate_skill.py
      - run: python scripts/nexcanvas_cli.py doctor

  reference-validation:
    name: Reference project postflight
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/nexcanvas_cli.py postflight examples/v2-rag-reference
      - run: python scripts/nexcanvas_cli.py postflight examples/v3-dense-industrial-ai
      - run: python scripts/nexcanvas_cli.py postflight examples/v4-hub-spoke-industrial
      - run: python scripts/nexcanvas_cli.py postflight examples/v5-multi-agent-workflow

  quality-gate:
    name: Quality gate
    if: always()
    needs: [core-tests, skill-validation, reference-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job
        env:
          CORE_RESULT: ${{ needs.core-tests.result }}
          SKILL_RESULT: ${{ needs.skill-validation.result }}
          REFERENCE_RESULT: ${{ needs.reference-validation.result }}
        run: |
          python - <<'PY'
          import os
          import sys

          results = {
              "core-tests": os.environ["CORE_RESULT"],
              "skill-validation": os.environ["SKILL_RESULT"],
              "reference-validation": os.environ["REFERENCE_RESULT"],
          }
          failed = {name: result for name, result in results.items() if result != "success"}
          if failed:
              print(f"Quality gate failed: {failed}")
              sys.exit(1)
          print("Quality gate passed.")
          PY
