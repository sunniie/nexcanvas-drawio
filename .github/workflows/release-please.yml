name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare release pull request or GitHub Release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Normalize GitHub release title
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release edit "$RELEASE_TAG" --title "NexCanvas $RELEASE_TAG"

      - name: Check out released tag
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Set up release Python
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build Python wheel and source distribution
        if: ${{ steps.release.outputs.release_created }}
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Build checksummed skill bundle
        if: ${{ steps.release.outputs.release_created }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          archive="nexcanvas-drawio-${RELEASE_TAG}.zip"
          git archive --format=zip --output="$archive" "$RELEASE_TAG"
          sha256sum "$archive" dist/* > SHA256SUMS.txt

      - name: Upload release assets
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" "nexcanvas-drawio-${RELEASE_TAG}.zip" dist/* SHA256SUMS.txt --clobber
